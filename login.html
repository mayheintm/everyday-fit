<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Everyday Fit</title>
  <!-- သီးသန့် login.css ဖိုင်သို့ ချိတ်ဆက်ခြင်း -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Login Card Container -->
  <div class="login-card">
    
    <!-- App Logo & Title -->
    <div class="header-section">
      <span class="logo-emoji">🥗</span>
      <h1 class="title">Welcome Back</h1>
      <p class="subtitle">Sign in to your Everyday Fit account</p>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleLogin(event)" class="login-form">
      <div class="form-group">
        <label for="usernameInput" class="form-label">Username</label>
        <input 
          type="text" 
          id="usernameInput" 
          required 
          placeholder="Enter your name (e.g. May)" 
          class="form-input"
        >
      </div>

      <div class="form-group">
        <label for="passwordInput" class="form-label">Password</label>
        <input 
          type="password" 
          id="passwordInput" 
          required 
          placeholder="••••••••" 
          class="form-input"
        >
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" class="remember-checkbox">
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">
        Sign In
      </button>
    </form>

    <!-- Footer Register Link -->
    <p class="footer-text">
      Don't have an account? 
      <a href="#" class="signup-link">Sign up</a>
    </p>

  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      
      if (username) {
        // LocalStorage တွင် နာမည်ကို သိမ်းဆည်းခြင်း
        localStorage.setItem('username', username);
        
        // index.html (Dashboard) သို့ တန်းသွားမည်
        window.location.href = 'index.html';
      }
    }
  </script>

</body>
</html>
